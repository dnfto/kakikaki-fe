			shellScript = "# Kakao Native App Key를 env 파일에서 읽어서 Info.plist에 주입\n\n# Xcode 빌드 Configuration에 따라 사용할 env 파일 선택\nif echo \"${CONFIGURATION}\" | grep -qi \"prod\"; then\n    ENV_FILE=\"${PROJECT_DIR}/../prod.env\"\nelse\n    ENV_FILE=\"${PROJECT_DIR}/../dev.env\"\nfi\n\nINFO_PLIST=\"${PROJECT_DIR}/Runner/Info.plist\"\nKAKAO_KEY=\"\"\n\nif [ -f \"$ENV_FILE\" ]; then\n    KAKAO_KEY=$(grep \"^KAKAO_NATIVE_APP_KEY=\" \"$ENV_FILE\" | cut -d'=' -f2 | tr -d '\"' | tr -d ' ')\n    if [ -n \"$KAKAO_KEY\" ]; then\n        echo \"Kakao Native App Key 발견: ${KAKAO_KEY:0:8}...\"\n        # 플레이스홀더가 아직 남아있는 경우에만 치환 (중복 치환 방지)\n        if grep -q \"kakaoKAKAO_NATIVE_APP_KEY_PLACEHOLDER\" \"$INFO_PLIST\"; then\n            sed -i '' \"s/kakaoKAKAO_NATIVE_APP_KEY_PLACEHOLDER/kakao$KAKAO_KEY/g\" \"$INFO_PLIST\"\n            echo \"Info.plist에 Kakao URL scheme 주입 완료\"\n        else\n            echo \"Info.plist에 이미 Kakao URL scheme이 설정되어 있습니다. (직접 설정됨)\"\n        fi\n    else\n        echo \"⚠️ 경고: $ENV_FILE에서 KAKAO_NATIVE_APP_KEY를 찾을 수 없습니다.\"\n    fi\nelse\n    echo \"⚠️ 경고: $ENV_FILE 파일을 찾을 수 없습니다.\"\nfi\n";
		};
