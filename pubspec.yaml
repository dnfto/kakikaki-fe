name: kakikaki
description: "Lingorithm의 일본어 일기 학습 앱, 카키카키"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+6

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  provider: ^6.1.2
  http: ^1.2.2
  lottie: ^3.3.1
  sentry_flutter: ^9.7.0
  logger: ^2.5.0
  kakao_flutter_sdk: ^1.9.5
  sign_in_with_apple: ^6.1.1
  kakao_flutter_sdk_user: ^1.9.7+3
  interactive_bottom_sheet: ^1.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_native_splash: ^2.4.3
  flutter_bloc: ^8.1.3
  build_runner: ^2.4.6
  injectable: ^2.3.4
  freezed_annotation: ^2.4.1
  get_it: ^7.6.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  bloc_concurrency: ^0.2.2
  fluttertoast: ^8.2.2
  dio: ^5.5.0+1
  infinite_scroll_pagination: ^4.0.0
  json_annotation: ^4.9.0
  go_router: ^15.1.3
  table_calendar: ^3.0.9
  flutter_svg: ^2.0.10+1
  flutter_secure_storage: ^9.0.0
  permission_handler: ^12.0.0+1
  cupertino_icons: ^1.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.0
  path: ^1.9.1
  android_intent_plus: ^5.0.2
  arb_merger: ^0.0.2
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.2.1
  flutter_launcher_icons: ^0.14.3
  device_info_plus: ^12.3.0
  google_fonts: ^6.2.1
  share_plus: ^10.0.2
  app_links: ^6.4.1
  flutter_slidable: ^3.0.1
  supabase_flutter: ^2.12.0
  shimmer: ^3.0.0
  google_sign_in: ^6.2.1
  sqflite: ^2.4.2
  xml: ^6.5.0
  fsrs: ^2.0.1
  crypto: ^3.0.7
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_analytics: ^12.1.3
  tutorial_coach_mark: ^1.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: any
  freezed: ^2.5.1
  json_serializable: any
  hive_generator: any
  go_router_builder: ^2.7.1
  flutter_lints: ^5.0.0

arb_merger:
  supported_locales: ["en", "ko", "ja"]
  input_filepath: "lib/l10n"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/common/moon.jpeg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/common/moon.jpeg"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - dev.env
    - prod.env
    - assets/icons/
    - assets/icons/common/
    - assets/icons/pages/auth/
    - assets/icons/pages/study/
    - assets/images/
    - assets/images/common/
    - assets/lottie/
    - assets/data/